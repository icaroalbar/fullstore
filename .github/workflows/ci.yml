name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Só instala; quem roda o lint é o make check, igual à máquina local.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - run: make check

      - name: Cobertura de internal/domain >= 80% (RNF-01)
        run: |
          if [ -z "$(find internal/domain -name '*.go' -print -quit 2>/dev/null)" ]; then
            echo "internal/domain ainda não existe; checagem ignorada"
            exit 0
          fi
          go test -coverprofile="$RUNNER_TEMP/domain.out" ./internal/domain/...
          total="$(go tool cover -func="$RUNNER_TEMP/domain.out" | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          echo "Cobertura de internal/domain: ${total}%"
          awk -v total="$total" 'BEGIN { exit !(total >= 80) }'
